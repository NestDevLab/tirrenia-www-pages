name: Mirror Tirrenia public site

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: tirrenia-www-mirror
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror public bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout www distribution
        uses: actions/checkout@v5
        with:
          path: site

      - name: Checkout canonical public bundle
        uses: actions/checkout@v5
        with:
          repository: NestDevLab/tirrenia-site
          ref: gh-pages
          path: source

      - name: Mirror bundle
        run: |
          set -euo pipefail

          if [ ! -f source/index.html ]; then
            echo "::error::The canonical public bundle is missing its locale entry point"
            exit 1
          fi

          rsync -a --delete --exclude .git --exclude .github source/ site/
          printf '%s\n' 'www.tirrenia.eu' > site/CNAME
          touch site/.nojekyll

          source_sha="$(git -C source rev-parse HEAD)"
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -A

          if git -C site diff --cached --quiet; then
            echo "The www distribution already matches ${source_sha}."
            exit 0
          fi

          git -C site commit -m "deploy: mirror Tirrenia site ${source_sha}"
          git -C site push origin main
