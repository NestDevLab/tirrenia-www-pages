<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=/it/" />
    <title>Tirrenia</title>
    <script>
      (() => {
        const supported = ["it", "en", "nl"];
        const languages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language || "it"];
        const locale =
          languages
            .map((language) => language.toLowerCase().split("-")[0])
            .find((language) => supported.includes(language)) || "it";

        window.location.replace(`/${locale}/${window.location.search}${window.location.hash}`);
      })();
    </script>
  </head>
  <body>
    <p><a href="/it/">Entra in Tirrenia</a></p>
  </body>
</html>
